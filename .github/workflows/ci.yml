name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RESONITE_INSTALL_DIR: ${{ github.workspace }}/Resonite

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare fallback references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RESONITE_INSTALL_DIR}/Libraries" "${RESONITE_INSTALL_DIR}/rml_libs"
          curl -fsSL -o "${RESONITE_INSTALL_DIR}/Libraries/ResoniteModLoader.dll" \
            https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/ResoniteModLoader.dll
          curl -fsSL -o "${RESONITE_INSTALL_DIR}/rml_libs/0Harmony.dll" \
            https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/0Harmony.dll

      - name: Restore
        run: dotnet restore ./ResoniteSpatialVariableGizmoMod.sln -p:ResonitePath="${{ env.RESONITE_INSTALL_DIR }}/"

      - name: Verify formatting
        shell: bash
        run: |
          dotnet format whitespace ./ResoniteSpatialVariableGizmoMod.sln --verify-no-changes --no-restore
          dotnet format style ./ResoniteSpatialVariableGizmoMod.sln --verify-no-changes --no-restore --severity info
          dotnet format analyzers ./ResoniteSpatialVariableGizmoMod.sln --verify-no-changes --no-restore --severity info

      - name: Build
        run: dotnet build ./ResoniteSpatialVariableGizmoMod.sln -c Release --no-restore -p:ResonitePath="${{ env.RESONITE_INSTALL_DIR }}/"

      - name: Test
        run: dotnet test ./ResoniteSpatialVariableGizmoMod.sln -c Release --no-build -p:ResonitePath="${{ env.RESONITE_INSTALL_DIR }}/"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')
          $assemblyPath = Resolve-Path 'SpatialVariableGizmo/bin/Release/SpatialVariableGizmo.dll'
          $actual = [System.Reflection.AssemblyName]::GetAssemblyName($assemblyPath).Version.ToString(3)
          if ($actual -ne $expected) {
            throw "Release tag $expected does not match assembly version $actual."
          }

      - name: Pack artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp ./SpatialVariableGizmo/bin/Release/SpatialVariableGizmo.dll ./artifacts/

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: SpatialVariableGizmo
          path: artifacts/SpatialVariableGizmo.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: SpatialVariableGizmo
          path: artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ./artifacts/SpatialVariableGizmo.dll --repo "${{ github.repository }}" --verify-tag --generate-notes
